name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (mandatory)
        run: make

      - name: Build (bonus)
        run: make bonus

      - name: Clean
        run: make fclean

  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install norminette
        run: pip install norminette

      - name: Run norminette
        run: norminette *.c *.h
